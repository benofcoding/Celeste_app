{% extends "layout.html" %}
{% block content %}


<div class="verify-runs-container">
    <h1 class="verify-run-header"> Verify Runs</h1>
    {% for i in runs %}
        <div class="verify-runs-run">
            <div class="verify-run-text">{{i[2]}}</div>
            {% if i[-1] %}
                <a class="verify-run-text" href="/view_individual_level_run/{{ i[1] }}">{{i[3]}}</a>
                <div class="verify-run-text" >{{ i[6] }} | {{ i[7] }}</div>
            {% else %}
                <a class="verify-run-text" href="/view_fullgame_run/{{ i[1] }}">{{i[3]}}</a>
                <div class="verify-run-text">{{ i[5] }}</div>
            {% endif %}
        </div>
    {% endfor %}
</div>

{% endblock %}
